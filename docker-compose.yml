version: '3.9'

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: smartpark_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartpark
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartpark2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartpark"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartpark_net

  # ── Redis Cache ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: smartpark_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-smartpark_redis_2026} --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-smartpark_redis_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartpark_net

  # ── Backend API (Node.js + Express) ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartpark_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-smartpark2026}@postgres:5432/smartpark
      REDIS_URL: redis://:${REDIS_PASSWORD:-smartpark_redis_2026}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-smartpark_jwt_secret_change_in_production_2026}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:80}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ADMIN_SECURITY_PIN: ${ADMIN_SECURITY_PIN:-000000}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - smartpark_net

  # ── Frontend (React/Vite → Nginx) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    container_name: smartpark_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smartpark_net

# ── Volumes ──────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ── Networks ─────────────────────────────────────────────────────────
networks:
  smartpark_net:
    driver: bridge
